apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 1h
  url: https://pkgs.tailscale.com/helmcharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: 1.98.9
      sourceRef:
        kind: HelmRepository
        name: tailscale
  values:
    # oauth is deliberately unset. Unset, the chart mounts the Secret named
    # operator-oauth; set, it would put the client secret in git.
    apiServerProxyConfig:
      # The Kubernetes API stays off the tailnet. It is already reachable two
      # ways, and this would be a third with its own auth model to get wrong.
      mode: "false"
