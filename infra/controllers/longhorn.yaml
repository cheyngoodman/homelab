apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  chart:
    spec:
      chart: longhorn
      version: 1.12.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
  values:
    persistence:
      # k3s ships local-path as default. Two default classes is an error state.
      defaultClass: false
      defaultClassReplicaCount: 2
    defaultSettings:
      # Below the three workers available. A replica needs iscsid, which
      # cloud-init now enables on every worker, so 3 is reachable; not raised.
      defaultReplicaCount: 2
      # Without this a pod stranded on a dead node waits for a hand, which is
      # the whole failover this exists for.
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
