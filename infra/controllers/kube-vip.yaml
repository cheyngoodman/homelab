apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  interval: 1h
  url: https://kube-vip.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-vip
      version: 0.11.0
      sourceRef:
        kind: HelmRepository
        name: kube-vip
  values:
    config:
      address: "10.0.0.50"
    env:
      vip_interface: eth0
      vip_arp: "true"
      vip_leaderelection: "true"
      cp_enable: "true"
      cp_namespace: kube-system
      lb_enable: "true"
      lb_port: "6443"
      # Chart defaults this on. MetalLB owns LoadBalancer Services.
      svc_enable: "false"
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
        operator: Exists
