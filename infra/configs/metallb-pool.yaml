apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan-pool
  namespace: metallb-system
spec:
  # Starts at .51: kube-vip holds .50 and the two do not coordinate. Stops at
  # .63, the end of the 10.0.0.48/28 VIP block (NETWORK.md).
  addresses:
    - 10.0.0.51-10.0.0.63
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan
  namespace: metallb-system
spec:
  ipAddressPools:
    - lan-pool
